<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeta TiPum - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="img/logo-tipum.png" alt="Logo Cafeta TiPum">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="acciones-usuario">
            <a href="login.html">Iniciar Sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html">🛒 Carrito</a>
        </div>
    </header>

    <main>
        <section id="seccion-registro">
            <article class="formulario-contenedor">
                <h2>NUEVO USUARIO</h2>
                <p>Únete a la familia de Cafeta TiPum</p>

                <!-- formulario interactivo -->
                <form id="formRegistro">
                    <div class="grupo-form">
                        <label for="run">RUN (Sin puntos ni guión):</label>
                        <input type="text" id="run" name="run" placeholder="Ej: 19011022K" autocomplete="off">
                        <span class="error" id="errorRun"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juanito" maxlength="50">
                        <span class="error" id="errorNombre"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" maxlength="100">
                        <span class="error" id="errorApellidos"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" autocomplete="email">
                        <span class="error" id="errorCorreo"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="fechaNacimiento">Fecha de nacimiento:</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                        <span class="error" id="errorFecha"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="direccion">Dirección:</label>
                        <textarea id="direccion" name="direccion" maxlength="300" placeholder="Ej: Av. Directo al Liquid, Depto 420"></textarea>
                        <span class="error" id="errorDireccion"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="region">Región:</label>
                        <select id="region" name="region">
                            <option value="">-- Seleccione una región --</option>
                        </select>
                        <span class="error" id="errorRegion"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="comuna">Comuna:</label>
                        <select id="comuna" name="comuna">
                            <option value="">-- Seleccione una comuna --</option>
                        </select>
                        <span class="error" id="errorComuna"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="pass">Contraseña:</label>
                        <input type="password" id="pass" name="pass">
                        <span class="error" id="errorPass"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="passConfirm">Confirmar Contraseña:</label>
                        <input type="password" id="passConfirm" name="passConfirm">
                        <span class="error" id="errorPassConfirm"></span>
                    </div>

                    <!-- botón de registro -->
                    <button type="submit" class="btn btn-primary w-100 mt-3">Registrar en Cafeta TiPum</button>

                    <!-- mensaje de éxito que se mostrará con JavaScript -->
                    <p id="mensajeExito" class="mt-3 text-center fw-bold" style="color: green; display: none;">¡Usuario
                        registrado con éxito!</p>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cafeta TiPum. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/validaciones.js"></script>
</body>

</html>
