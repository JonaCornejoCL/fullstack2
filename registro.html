<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeta TiPum - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="img/logo-tipum.png" alt="Logo Cafeta TiPum" width="150">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="seccion-registro">
            <article class="formulario-contenedor">
                <h2>NUEVO USUARIO</h2>
                <p>Únete a la familia de Cafeta TiPum</p>

                <!-- formulario interactivo -->
                <form id="formRegistro">
                    <div class="grupo-form">
                        <label for="run">RUN (Sin puntos ni guión):</label>
                        <input type="text" id="run" name="run" placeholder="Ej: 19011022K" autocomplete="off">
                        <span class="error" id="errorRun"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juanito"maxlength="50">
                        <span class="error" id="errorNombre"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" maxlength="100">
                        <span class="error" id="errorApellidos"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" autocomplete="email">
                        <span class="error" id="errorCorreo"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="pass">Contraseña:</label>
                        <input type="password" id="pass" name="pass">
                        <span class="error" id="errorPass"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="passConfirm">Confirmar Contraseña:</label>
                        <input type="password" id="passConfirm" name="passConfirm">
                        <span class="error" id="errorPassConfirm"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento"><!--aquí va el required para la validación en HTML-->
                        <span class="error" id="errorFecha"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="region">Región:</label>
                        <select id="region" name="region">
                            <option value="">-- Seleccione una región --</option>
                        </select>
                        <span class="error" id="errorRegion"></span>
                    </div>

                    <div class="grupo-form">
                        <label for="comuna">Comuna:</label>
                        <select id="comuna" name="comuna">
                            <option value="">-- Seleccione una comuna --</option>
                        </select>
                        <span class="error" id="errorComuna"></span>
                    </div>

                    <button type="submit" class="btn-primary">REGISTRAR</button>
                    <p id="mensajeExito" class="mt-3" style="color: green; display: none;">¡Usuario registrado con
                        éxito!</p>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cafeta TiPum. Todos los derechos reservados.</p>
    </footer>

    <!-- validación estilo profe Hernán -->
    <script src="js/validaciones.js"></script>
</body>

</html>
