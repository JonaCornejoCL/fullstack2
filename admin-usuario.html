<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light">
    <header class="bg-dark py-3">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <span class="text-white fs-4 fw-bold">⚙️ Admin TiPum</span>
            </div>

            <nav class="d-none d-lg-flex gap-4">
                <a href="#" class="text-white text-decoration-none">Dashboard</a>
                <a href="admin-producto.html" class="text-white text-decoration-none">Gestión Productos</a>
                <a href="admin-usuario.html" class="text-warning fw-bold text-decoration-none">Gestión Usuarios</a>
            </nav>

            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <main class="container mt-5 mb-5 d-flex justify-content-center">
        <section class="w-100" style="max-width: 600px;">
            <article class="formulario-contenedor shadow p-4 rounded bg-white">
                <h2 class="text-center mb-3 text-dark">NUEVO USUARIO</h2>
                <p class="text-center text-muted mb-4">Crea una cuenta nueva y asigna sus permisos en el sistema.</p>
        
                <form id="formAdminUsuario">
                    <div class="mb-3">
                        <label for="adminRun" class="form-label fw-bold">RUN (Sin puntos ni guión):</label>
                        <input type="text" id="adminRun" class="form-control" placeholder="Ej: 19011022K" autocomplete="off">
                        <span class="error text-danger" id="errorAdminRun"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="adminNombre" class="form-label fw-bold">Nombre:</label>
                            <input type="text" id="adminNombre" class="form-control" maxlength="50">
                            <span class="error text-danger" id="errorAdminNombre"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="adminApellidos" class="form-label fw-bold">Apellidos:</label>
                            <input type="text" id="adminApellidos" class="form-control" maxlength="100">
                            <span class="error text-danger" id="errorAdminApellidos"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="adminCorreo" class="form-label fw-bold">Correo electrónico:</label>
                        <input type="email" id="adminCorreo" class="form-control">
                        <span class="error text-danger" id="errorAdminCorreo"></span>
                    </div>

                    <div class="mb-3">
                        <label for="adminRol" class="form-label fw-bold">Rol en el sistema:</label>
                        <select id="adminRol" class="form-select">
                            <option value="">-- Seleccionar Rol --</option>
                            <option value="cliente">Cliente</option>
                            <option value="vendedor">Vendedor</option>
                            <option value="administrador">Administrador</option>
                        </select>
                        <span class="error text-danger" id="errorAdminRol"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="adminPass" class="form-label fw-bold">Contraseña temporal:</label>
                            <input type="password" id="adminPass" class="form-control">
                            <span class="error text-danger" id="errorAdminPass"></span>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="adminPassConfirm" class="form-label fw-bold">Confirmar Contraseña:</label>
                            <input type="password" id="adminPassConfirm" class="form-control">
                            <span class="error text-danger" id="errorAdminPassConfirm"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 mt-2">Crear Usuario</button>

                    <p id="mensajeUserExito" class="mt-3 text-center fw-bold text-success" style="display: none;">¡Usuario creado exitosamente!</p>
                </form>
            </article>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Cafeta TiPum - Panel de Administración.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
