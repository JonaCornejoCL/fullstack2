<!DOCTYPE html>
<html lang="es">

<head>

            </a>

        </div>

                <a href="blogs.html" class="text-dark fw-bold text-decoration-none py-1">Blogs</a>

                <a href="login.html" class="text-dark fw-bold text-decoration-none py-1">Iniciar Sesión</a>
                <a href="registro.html" class="text-dark fw-bold text-decoration-none py-1">Registrar usuario</a>

    <main class="container my-5">
        <section id="catalogo" class="text-center">
            <h2 class="mb-4 fw-bold" style="color: #3E2723;">Nuestro Menú</h2>
            <p class="text-muted mb-5">Conoce nuestras especialidades hechas con amor.</p>
            
            <div id="contenedor-productos" class="grid-productos"></div>

    <footer>
        <p>&copy; 2026 Cafeta TiPum. Todos los derechos reservados.</p>
