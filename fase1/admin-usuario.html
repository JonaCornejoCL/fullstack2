<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeta TiPum - Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light">
    <!-- navbar del admin -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Cafeta TiPum (Admin)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAdmin">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navAdmin">
                <ul class="navbar-nav ms-auto gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-bold" href="admin-dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-bold" href="admin-producto.html">Gestión Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-bold active" href="admin-usuario.html">Gestión Usuarios</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-light btn-sm mt-1" href="index.html">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"
                onclick="limpiarFormulario()">+ Nuevo Usuario</button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>RUN</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Comuna</th>
                                <th>Rol</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <!-- Se puebla dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Agregar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formAdminUsuario">
                        <input type="hidden" id="usuarioIndex">
                        <div class="mb-3">
                            <label for="adminRun" class="form-label">RUN</label>
                            <input type="text" id="adminRun" class="form-control" placeholder="19011022K" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminNombre" class="form-label">Nombre Completo</label>
                            <input type="text" id="adminNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminCorreo" class="form-label">Correo Electrónico</label>
                            <input type="email" id="adminCorreo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminComuna" class="form-label">Comuna</label>
                            <input type="text" id="adminComuna" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="adminRol" class="form-label">Rol</label>
                            <select id="adminRol" class="form-select">
                                <option value="Cliente">Cliente</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-usuarios.js"></script>
</body>

</html>
