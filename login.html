<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeta TiPum - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="img/logo-tipum.png" alt="Logo Cafeta TiPum">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="acciones-usuario">
            <a href="login.html">Iniciar Sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html">🛒 Carrito</a>
        </div>
    </header>

    <main class="container mt-5 mb-5 d-flex justify-content-center">
        <section id="seccion-login" class="w-100" style="max-width: 500px;">
            <article class="formulario-contenedor shadow p-4 rounded bg-white">
                <h2 class="text-center mb-3">INICIAR SESIÓN</h2>
                <p class="text-center text-muted mb-4">Bienvenido de vuelta a Cafeta TiPum</p>

                <!-- formulario interactivo de login -->
                <form id="formLogin">
                    <div class="grupo-form mb-3">
                        <label for="correoLogin" class="form-label">Correo electrónico:</label>
                        <input type="email" id="correoLogin" name="correoLogin" class="form-control" placeholder="Ej: usuario@gmail.com" maxlength="100" autocomplete="email">
                        <span class="error text-danger" id="errorCorreoLogin"></span>
                    </div>

                    <div class="grupo-form mb-4">
                        <label for="passLogin" class="form-label">Contraseña:</label>
                        <input type="password" id="passLogin" name="passLogin" class="form-control">
                        <span class="error text-danger" id="errorPassLogin"></span>
                    </div>

                    <!-- botón de ingreso -->
                    <button type="submit" class="btn btn-primary w-100 mt-2" style="background-color: #d1321e; border-color: #d1321e;">Ingresar</button>

                    <!-- mensaje de éxito que se mostrará con JavaScript -->
                    <p id="mensajeLoginExito" class="mt-3 text-center fw-bold text-success" style="display: none;">¡Ingreso exitoso!</p>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cafeta TiPum. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/validaciones.js"></script>
</body>

</html>
