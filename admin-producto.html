<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Nuevo Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light">
    <header class="bg-dark py-3">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <span class="text-white fs-4 fw-bold">⚙️ Admin TiPum</span>
            </div>

            <nav class="d-none d-lg-flex gap-4">
                <a href="#" class="text-white text-decoration-none">Dashboard</a>
                <a href="admin-producto.html" class="text-warning fw-bold text-decoration-none">Gestión Productos</a>
                <a href="#" class="text-white text-decoration-none">Gestión Usuarios</a>
            </nav>

            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <main class="container mt-5 mb-5 d-flex justify-content-center">
        <section class="w-100" style="max-width: 600px;">
            <article class="formulario-contenedor shadow p-4 rounded bg-white">
                <h2 class="text-center mb-3 text-dark">NUEVO PRODUCTO</h2>
                <p class="text-center text-muted mb-4">Ingresa los datos del nuevo producto para el catálogo.</p>

                <form id="formNuevoProducto">
                    <div class="mb-3">
                        <label for="nombreProducto" class="form-label fw-bold">Nombre del Producto:</label>
                        <input type="text" id="nombreProducto" class="form-control" placeholder="Ej: Café Americano">
                        <span class="error text-danger" id="errorNombreProd"></span>
                    </div>

                    <div class="mb-3">
                        <label for="descProducto" class="form-label fw-bold">Descripción (Opcional):</label>
                        <textarea id="descProducto" class="form-control" rows="2" maxlength="500" placeholder="Máx 500 caracteres..."></textarea>
                        <span class="error text-danger" id="errorDescProd"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precioProducto" class="form-label fw-bold">Precio ($):</label>
                            <input type="number" id="precioProducto" class="form-control" placeholder="Ej: 2500" min="0">
                            <span class="error text-danger" id="errorPrecioProd"></span>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoriaProducto" class="form-label fw-bold">Categoría:</label>
                            <select id="categoriaProducto" class="form-select">
                                <option value="">-- Seleccionar --</option>
                                <option value="cafe">Cafetería</option>
                                <option value="pasteleria">Pastelería</option>
                                <option value="merchandising">Merchandising</option>
                            </select>
                            <span class="error text-danger" id="errorCatProd"></span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="stockProducto" class="form-label fw-bold">Stock Inicial:</label>
                            <input type="number" id="stockProducto" class="form-control" placeholder="Ej: 50">
                            <span class="error text-danger" id="errorStockProd"></span>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="stockCritico" class="form-label fw-bold">Stock Crítico:</label>
                            <input type="number" id="stockCritico" class="form-control" placeholder="Ej: 10">
                            <span class="error text-danger" id="errorStockCritico"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 mt-2">Guardar Producto</button>

                    <p id="mensajeProdExito" class="mt-3 text-center fw-bold text-success" style="display: none;">¡Producto creado exitosamente!</p>
                    <p id="alertaStock" class="mt-2 text-center fw-bold text-warning" style="display: none;">⚠️ Atención: El stock inicial está en nivel crítico.</p>
                </form>
            </article>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Cafeta TiPum - Panel de Administración.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
